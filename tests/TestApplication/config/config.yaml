imports:
    - { resource: "@TmonierSyliusAdminOrderCreationPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusCompanyAccountsPlugin/config/config.yaml" }
    - { resource: "dbal_savepoints.php" }
    - { resource: "services.php" }

# Demo company (dev and test databases): admin, buyer and approver of Acme Industries
# (admin@acme-industries.example.com / sylius...), orders of the admin and the buyer.
sylius_fixtures:
    suites:
        default:
            fixtures:
                tmonier_company_accounts:
                    priority: -100
                    options:
                        orders_per_member: 2

# Test application only: a tab added to "My company" by another plugin (extension point test).
twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

sylius_twig_hooks:
    hooks:
        'tmonier_company_accounts.shop.account.company.tabs':
            test_extra:
                template: 'company_tabs/extra.html.twig'
                priority: 0
