# Import this file from your application's config/routes:
#
# tmonier_sylius_company_accounts:
#     resource: "@TmonierSyliusCompanyAccountsPlugin/config/routes.yaml"

tmonier_company_accounts_admin:
    resource: "@TmonierSyliusCompanyAccountsPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

tmonier_company_accounts_shop:
    resource: "@TmonierSyliusCompanyAccountsPlugin/config/routes/shop.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
